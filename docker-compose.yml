services:
  contest-judging:
    build: .
    image: contest-judging:latest
    container_name: contest-judging
    restart: unless-stopped
    env_file: .env
    ports:
      # 같은 서버의 리버스 프록시(Nginx 등)에서만 접근. 외부에 직접 열려면 앞의 127.0.0.1: 제거
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - judging-data:/app/data      # 심사 점수·출품작·로그 (컨테이너를 다시 만들어도 유지)
      - ./seed:/app/seed:ro         # 처음 실행 때만 읽는 출품작 목록(14건)

volumes:
  judging-data:
